[workspace]
resolver = "2"
members = ["contracts/pool", "contracts/vault", "contracts/faucet", "contracts/pool-v3", "contracts/factory", "contracts/market"]
[workspace.dependencies]
soroban-sdk = "=28.0.0"
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
